main-menu:
  title: "<gradient:#00ffaa:#00aaff>Cấp Mạo Hiểm</gradient>"
  size: 54
  filler:
    enabled: true
    material: BLACK_STAINED_GLASS_PANE
    name: " "
    lore: []

  items:
    profile:
      slot: 10
      material: PLAYER_HEAD
      name: "<gradient:#00ffaa:#00aaff>{player}</gradient>"
      lore:
        - "<gray>Danh hiệu:</gray> {title}"
        - "<gray>Cấp Mạo Hiểm:</gray> <aqua>{level}</aqua><dark_gray>/</dark_gray><blue>{max_level}</blue>"
        - "<gray>Điểm Thám Hiểm:</gray> <yellow>{exp}</yellow><dark_gray>/</dark_gray><gold>{required_exp}</gold>"
        - "<gray>Tiến trình:</gray> <green>{progress_percent}%</green>"
        - "{progress_bar}"

    level:
      slot: 12
      material: EXPERIENCE_BOTTLE
      name: "<aqua>⚔ Cấp Mạo Hiểm</aqua>"
      lore:
        - "<gray>AL hiện tại:</gray> <aqua>{level}</aqua>"
        - "<gray>Cấp tối đa:</gray> <blue>{max_level}</blue>"
        - "<gray>Danh hiệu:</gray> {title}"

    exp:
      slot: 14
      material: AMETHYST_SHARD
      name: "<yellow>✦ Điểm Thám Hiểm</yellow>"
      lore:
        - "<gray>AE hiện tại:</gray> <yellow>{exp}</yellow>"
        - "<gray>AE cần:</gray> <gold>{required_exp}</gold>"
        - "<gray>Còn thiếu:</gray> <red>{remaining_exp}</red>"
        - "<gray>Tổng AE đã nhận:</gray> <green>{total_exp}</green>"
        - ""
        - "{progress_bar}"

    title:
      slot: 16
      material: NETHER_STAR
      name: "<gold>🏅 Danh Hiệu Mạo Hiểm</gold>"
      lore:
        - "<gray>Hiện tại:</gray> {title}"
        - "<gray>Tên thô:</gray> <white>{title_raw}</white>"
        - "<gray>Danh hiệu kế tiếp:</gray> {next_title}"
        - "<gray>Mở khóa tại:</gray> <aqua>AL {next_title_min_level}</aqua>"

    unlocked-stats:
      slot: 28
      material: LIME_DYE
      name: "<green>✔ Chỉ Số Đã Mở Khóa</green>"
      lore:
        - "<gray>Nhấn để xem các chỉ số bạn đã mở khóa.</gray>"
      action: "open_unlocked_stats"

    locked-stats:
      slot: 30
      material: GRAY_DYE
      name: "<red>✖ Chỉ Số Chưa Mở Khóa</red>"
      lore:
        - "<gray>Nhấn để xem các chỉ số sẽ mở khóa ở cấp cao hơn.</gray>"
      action: "open_locked_stats"

    current-stats:
      slot: 32
      material: DIAMOND_SWORD
      name: "<aqua>⚔ Chỉ Số Đang Được Cộng</aqua>"
      lore:
        - "<gray>Nhấn để xem tổng chỉ số hiện tại từ Cấp Mạo Hiểm.</gray>"
      action: "open_current_stats"

    leaderboard:
      slot: 34
      material: GOLD_INGOT
      name: "<gold>🏆 Bảng Xếp Hạng</gold>"
      lore:
        - "<gray>Hạng hiện tại:</gray> <yellow>#{rank}</yellow>"
        - "<gray>Nhấn để xem top Cấp Mạo Hiểm.</gray>"
      action: "open_top"

    close:
      slot: 49
      material: BARRIER
      name: "<red>Đóng</red>"
      lore: []
      action: "close"

