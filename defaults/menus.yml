stats-menu:
  title: "<gradient:#00ffaa:#00aaff>Chỉ Số Cấp Mạo Hiểm</gradient>"
  size: 54
  filler:
    enabled: true
    material: BLACK_STAINED_GLASS_PANE
    name: " "
    lore: []
  item:
    unlocked-name: "<green>✔ {stat_name}</green>"
    locked-name: "<red>✖ {stat_name} *</red>"
    unlocked-lore:
      - "<gray>Trạng thái:</gray> <green>Đã mở khóa</green>"
      - "<gray>Tích hợp:</gray> <white>{availability}</white>"
      - "<gray>Đang cộng:</gray> <aqua>+{value}</aqua>"
      - "<gray>Mở khóa từ:</gray> <yellow>AL {unlock_level}</yellow>"
      - "<gray>Giới hạn tối đa:</gray> <gold>{cap}</gold>"
    locked-lore:
      - "<gray>Trạng thái:</gray> <red>Chưa mở khóa</red>"
      - "<gray>Tích hợp:</gray> <white>{availability}</white>"
      - "<gray>Mở khóa tại:</gray> <yellow>AL {unlock_level}</yellow>"
      - "<gray>Còn thiếu:</gray> <red>{levels_remaining} cấp</red>"
      - ""
      - "<red>* Chỉ số này chưa được mở khóa.</red>"
  integration-warning:
    enabled: true
    slot: 40
    material: YELLOW_DYE
    name: "<yellow>MythicLib chưa hoạt động</yellow>"
    lore:
      - "<gray>Giá trị bên trên được tính từ stats.yml.</gray>"
      - "<gray>Chỉ số chỉ được áp vào nhân vật khi có MythicLib.</gray>"
  back:
    slot: 49
    material: ARROW
    name: "<yellow>Quay lại</yellow>"
    lore: []
    action: "open_main"

