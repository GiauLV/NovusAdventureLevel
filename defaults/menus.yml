bicanh-player-menu:
  title: "<gradient:#FFD36A:#FF7849>Bí Cảnh Đột Phá</gradient>"
  status:
    no-gate: "KHÔNG CÓ BÍ CẢNH"
    not-ready: "CHƯA HOÀN THIỆN"
    running: "ĐANG TRONG BÍ CẢNH"
    arena-in-use: "BÍ CẢNH ĐANG ĐƯỢC SỬ DỤNG"
    completed: "ĐÃ HOÀN THÀNH"
    ready: "SẴN SÀNG"
    need-exp: "CHƯA ĐỦ AE"
  info:
    name: "<gold>✦ {bicanh}</gold>"
    lore:
      - "<gray>ID:</gray> <white>{id}</white>"
      - "<gray>Đột phá:</gray> <aqua>AL {level} → {next_level}</aqua>"
      - "<gray>AE:</gray> <yellow>{exp}</yellow><gray>/</gray><gold>{required_exp}</gold>"
      - "<gray>Trạng thái:</gray> <white>{status}</white>"
      - ""
      - "<gray>Thử thách:</gray> <white>{waves} wave × {mobs_per_wave} mob</white>"
      - "<gray>Thời gian:</gray> <white>{minutes} phút</white>"
      - "<gray>MythicMob:</gray> <white>{mobs}</white>"
      - "<gray>Hình phạt:</gray> <red>{punishment}</red>"
  start:
    name: "<green><bold>Bắt đầu Bí Cảnh</bold></green>"
    lore:
      - "<gray>Trạng thái:</gray> <white>{status}</white>"
      - "<gray>Yêu cầu:</gray> <yellow>AL {level}, đủ {required_exp} AE</yellow>"
      - ""
      - "<yellow>Nhấn để vào Bí Cảnh.</yellow>"

bicanh-admin-menu:
  title: "<gradient:#FFD700:#FF6B35>Quản trị Bí Cảnh</gradient> <gray>• {page}/{max_page}</gray>"
  entry:
    name: "<gold>{name}</gold> <dark_gray>({id})</dark_gray>"
    lore:
      - "<gray>Enabled:</gray> <white>{enabled}</white>"
      - "<gray>Trạng thái:</gray> <white>{status}</white>"
      - "<gray>Cổng:</gray> <aqua>AL {gate} → {next_level}</aqua> <gray>({type})</gray>"
      - "<gray>Tất cả cổng ({gate_count}):</gray> <white>{gate_list}</white>"
      - "<gray>Wave:</gray> <white>{waves} × {mobs_per_wave}</white>"
      - "<gray>Thời gian:</gray> <white>{minutes} phút</white>"
      - "<gray>Điểm vào:</gray> <white>{spawn}</white>"
      - "<gray>Điểm mob:</gray> <white>{points}/10</white>"
      - "<gray>MythicMobs:</gray> <white>{mythic_status}</white>"
      - "<gray>Mob:</gray> <white>{mobs}</white>"
      - "<gray>Hình phạt:</gray> <red>{punishment}</red>"
      - ""
      - "<yellow>Chuột trái:</yellow> dịch chuyển tới điểm vào"
      - "<aqua>Chuột phải:</aqua> xem chi tiết và các điểm"
      - "<light_purple>Shift + trái:</light_purple> chạy TEST"
