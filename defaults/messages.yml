prefix: "<gradient:#00ffaa:#00aaff>NovusAL</gradient> <dark_gray>»</dark_gray> "

messages:
  no-permission: "{prefix}<red>Bạn không có quyền sử dụng lệnh này.</red>"
  player-only: "{prefix}<red>Lệnh này chỉ dành cho người chơi.</red>"
  player-not-found: "{prefix}<red>Không tìm thấy người chơi {player}.</red>"
  invalid-number: "{prefix}<red>Số không hợp lệ.</red>"
  invalid-amount: "{prefix}<red>Giá trị AE không hợp lệ.</red>"
  amount-too-large: "{prefix}<red>Giá trị AE vượt quá giới hạn cho phép.</red>"
  invalid-range: "{prefix}<red>Khoảng AE không hợp lệ.</red>"
  positive-number-required: "{prefix}<red>Giá trị phải lớn hơn 0.</red>"
  non-negative-number-required: "{prefix}<red>Giá trị không được nhỏ hơn 0.</red>"
  level-out-of-range: "{prefix}<red>Cấp phải nằm trong khoảng {min_level}-{max_level}.</red>"
  exp-event-cancelled: "{prefix}<yellow>Thao tác cộng AE đã bị một plugin khác hủy.</yellow>"
  reload-success: "{prefix}<green>Đã reload cấu hình NovusAdventureLevel.</green>"

  help:
    - ""
    - "<gradient:#00ffaa:#00aaff><bold>Novus Adventure Level</bold></gradient>"
    - "<aqua>/capmaohiem</aqua> <gray>- Mở menu Cấp Mạo Hiểm</gray>"
    - "<aqua>/capmaohiem stats</aqua> <gray>- Mở menu chỉ số</gray>"
    - "<aqua>/capmaohiem top</aqua> <gray>- Mở bảng xếp hạng GUI</gray>"
    - "<aqua>/capmaohiem top chat</aqua> <gray>- Xem bảng xếp hạng trong chat</gray>"
    - "<aqua>/capmaohiem profile</aqua> <gray>- Xem hồ sơ trong chat</gray>"
    - "<aqua>/bicanh</aqua> <gray>- Mở menu Bí Cảnh Đột Phá</gray>"
    - "<aqua>/capmaohiem help</aqua> <gray>- Xem trợ giúp</gray>"
    - ""

  admin-help:
    - ""
    - "<gold><bold>Quản trị NovusAL</bold></gold>"
    - "<yellow>/capmaohiem admin give <player> <amount></yellow>"
    - "<yellow>/capmaohiem admin set <player> <level> [exp]</yellow>"
    - "<yellow>/capmaohiem admin take <player> <amount></yellow>"
    - "<yellow>/capmaohiem admin see <player></yellow>"
    - "<yellow>/capmaohiem admin reset <player></yellow>"
    - "<yellow>/capmaohiem reload</yellow>"
    - "<yellow>/al give <player> <amount|range> [-s] [-sf]</yellow>"
    - "<yellow>/al take <player> <amount> [-sf]</yellow>"
    - "<yellow>/al set <player> <exp> [-sf]</yellow>"
    - "<yellow>/al see <player></yellow>"
    - "<yellow>/adbc</yellow> <gray>- Quản trị Bí Cảnh</gray>"
    - ""

  profile:
    - ""
    - "<gold>✦ Cấp Mạo Hiểm</gold>"
    - "<gray>Người chơi:</gray> <white>{player}</white>"
    - "<gray>AL:</gray> <aqua>{level}</aqua>"
    - "<gray>AE:</gray> <yellow>{exp}</yellow><gray>/</gray><gold>{required_exp}</gold>"
    - "<gray>Tiến trình:</gray> <green>{progress_percent}%</green>"
    - "<gray>Danh hiệu:</gray> {title}"
    - "<gray>Danh hiệu kế tiếp:</gray> {next_title}"
    - ""

  admin-see:
    - ""
    - "<gold>✦ Dữ liệu Cấp Mạo Hiểm</gold>"
    - "<gray>Người chơi:</gray> <white>{player}</white>"
    - "<gray>UUID:</gray> <white>{uuid}</white>"
    - "<gray>Level:</gray> <aqua>{level}</aqua>"
    - "<gray>EXP:</gray> <yellow>{exp}</yellow>"
    - "<gray>Required EXP:</gray> <gold>{required_exp}</gold>"
    - "<gray>Total EXP:</gray> <green>{total_exp}</green>"
    - "<gray>Title:</gray> {title}"
    - ""

  top-header:
    - ""
    - "<gradient:#ffd700:#00ffaa><bold>Top Cấp Mạo Hiểm</bold></gradient>"
  top-entry: "<gold>#{rank}</gold> <white>{player}</white> <gray>-</gray> <aqua>AL {level}</aqua> <gray>({title_raw})</gray>"
  top-footer: ""
  top-empty: "{prefix}<yellow>Chưa có dữ liệu xếp hạng.</yellow>"

  admin-give: "{prefix}<green>Đã cộng {amount} AE cho {player}.</green>"
  admin-give-target: "{prefix}<green>Bạn nhận được <yellow>{amount}</yellow> Điểm Thám Hiểm.</green>"
  admin-take: "{prefix}<yellow>Đã trừ {amount} AE của {player}.</yellow>"
  admin-set: "{prefix}<green>Đã đặt {player} thành AL {level}, AE {exp}.</green>"
  admin-reset: "{prefix}<yellow>Đã reset dữ liệu của {player}.</yellow>"

  ae-give:
    sender: "{prefix}<green>Đã cộng <yellow>{amount}</yellow> AE cho <white>{player}</white>.</green>"
    target: "{prefix}<green>Bạn nhận được <yellow>{amount}</yellow> Điểm Thám Hiểm.</green>"
  ae-give-range:
    sender: "{prefix}<green>Đã chọn ngẫu nhiên <yellow>{amount}</yellow> AE trong khoảng <white>{min}-{max}</white> và cộng cho <white>{player}</white>.</green>"
  ae-take: "{prefix}<yellow>Đã trừ <gold>{amount}</gold> AE của <white>{player}</white>.</yellow>"
  ae-set: "{prefix}<green>Đã đặt AE hiện tại của <white>{player}</white> thành <yellow>{amount}</yellow>.</green>"
  ae-see:
    - ""
    - "<gold>✦ Dữ liệu Điểm Thám Hiểm</gold>"
    - "<gray>Người chơi:</gray> <white>{player}</white>"
    - "<gray>AL:</gray> <aqua>{level}</aqua>"
    - "<gray>AE:</gray> <yellow>{exp}</yellow><gray>/</gray><gold>{required_exp}</gold>"
    - "<gray>Tổng AE:</gray> <green>{total_exp}</green>"
    - ""

  mob-ae-gain: "{prefix}<green>Bạn nhận được <yellow>{amount}</yellow> Điểm Thám Hiểm.</green>"

  level-up-chat: "{prefix}<green>Chúc mừng! Bạn đã đạt <gold>Cấp Mạo Hiểm {level}</gold> <gray>({title_raw})</gray>.</green>"

  bicanh:
    admin-help:
      - ""
      - "<gold><bold>Quản trị Bí Cảnh</bold></gold>"
      - "<yellow>/adbc create <id></yellow>"
      - "<yellow>/adbc setspawn <id></yellow> <gray>| unsetspawn</gray>"
      - "<yellow>/adbc set <id> <diem1..diem10></yellow> <gray>| unset</gray>"
      - "<yellow>/adbc info <id></yellow>"
      - "<yellow>/adbc danhsach</yellow>"
      - "<yellow>/adbc test <id></yellow> <gray>| test stop</gray>"
      - "<yellow>/adbc reload</yellow>"
      - "<gray>Các lệnh thay đổi hỗ trợ cờ -sf; cờ -s dành cho thông báo người chơi.</gray>"
      - ""
    created: "{prefix}<green>Đã tạo mẫu <white>bicanh/{id}.yml</white>. Hãy chỉnh cấu hình rồi dùng <yellow>/adbc reload</yellow>.</green>"
    already-exists: "{prefix}<red>Bí Cảnh <white>{id}</white> đã tồn tại; plugin không ghi đè tệp.</red>"
    invalid-id: "{prefix}<red>ID Bí Cảnh chỉ được chứa chữ, số, dấu gạch dưới hoặc gạch ngang.</red>"
    create-error: "{prefix}<red>Không thể tạo tệp Bí Cảnh <white>{id}</white>. Xem console để biết chi tiết.</red>"
    not-found: "{prefix}<red>Không tìm thấy Bí Cảnh <white>{id}</white>.</red>"
    location-save-error: "{prefix}<red>Không thể lưu vị trí cho Bí Cảnh <white>{id}</white>.</red>"
    spawn-set: "{prefix}<green>Đã đặt điểm vào của Bí Cảnh <white>{id}</white>.</green>"
    spawn-unset: "{prefix}<yellow>Đã đưa điểm vào của Bí Cảnh <white>{id}</white> về NULL.</yellow>"
    invalid-point: "{prefix}<red>Điểm phải nằm trong khoảng <white>diem1</white> đến <white>diem10</white>.</red>"
    point-set: "{prefix}<green>Đã đặt <white>{point}</white> cho Bí Cảnh <white>{id}</white>.</green>"
    point-unset: "{prefix}<yellow>Đã đưa <white>{point}</white> của Bí Cảnh <white>{id}</white> về NULL.</yellow>"
    spawn-not-set: "{prefix}<red>Bí Cảnh <white>{id}</white> chưa có điểm vào.</red>"
    reload-success: "{prefix}<green>Đã nạp Bí Cảnh: <white>{loaded}</white> tệp, <green>{ready}</green> sẵn sàng, <yellow>{incomplete}</yellow> chưa hoàn thiện, <red>{invalid}</red> lỗi, <aqua>{gates}</aqua> cổng hoạt động.</green>"
    info:
      - ""
      - "<gold>✦ Bí Cảnh {name}</gold> <gray>({id})</gray>"
      - "<gray>Enabled:</gray> <white>{enabled}</white> <gray>| Trạng thái:</gray> <white>{status}</white>"
      - "<gray>Cổng:</gray> <aqua>AL {gate} → {next_level}</aqua> <gray>| Loại:</gray> <white>{type}</white>"
      - "<gray>Tất cả cổng ({gate_count}):</gray> <white>{gate_list}</white>"
      - "<gray>Wave:</gray> <white>{waves}</white> × <white>{mobs_per_wave}</white> mob <gray>| Thời gian:</gray> <white>{minutes} phút</white>"
      - "<gray>Điểm vào:</gray> <white>{spawn}</white>"
      - "<gray>Điểm mob:</gray> <white>{points}</white> <gray>| MythicMobs:</gray> <white>{mythic_status}</white>"
      - "<gray>Danh sách mob:</gray> <white>{mobs}</white>"
      - "<gray>Hình phạt:</gray> <white>{punishment}</white> <gray>| Phiên:</gray> <white>{session}</white>"
      - ""
    info-point: "<gray>• {point}:</gray> <white>{location}</white>"
    test-started: "{prefix}<aqua>Đã bắt đầu TEST Bí Cảnh <white>{bicanh}</white>. Chế độ này không đổi AL/AE, không phạt và không phát thông báo toàn máy chủ.</aqua>"
    started: "{prefix}<green>Đã bắt đầu Bí Cảnh <white>{bicanh}</white>. Chúc bạn may mắn!</green>"
    test-stopped: "{prefix}<yellow>Đã dừng an toàn phiên TEST Bí Cảnh <white>{bicanh}</white>.</yellow>"
    test-completed: "{prefix}<green>TEST hoàn tất: <white>{bicanh}</white>. Dữ liệu AL/AE không thay đổi.</green>"
    test-failed: "{prefix}<yellow>TEST thất bại: <white>{bicanh}</white>. Không áp dụng hình phạt.</yellow>"
    no-test-session: "{prefix}<red>Bạn không có phiên TEST đang chạy.</red>"
    test-start-error: "{prefix}<red>Không thể chạy TEST Bí Cảnh <white>{id}</white>: <white>{status}</white>.</red>"
    arena-in-use: "{prefix}<red>Bí Cảnh này đang được một người chơi khác sử dụng.</red>"
    wrong-level: "{prefix}<red>AL hiện tại không đúng với cổng của Bí Cảnh này.</red>"
    not-enough-exp: "{prefix}<red>Bạn chưa đạt đủ AE yêu cầu để đột phá.</red>"
    already-running: "{prefix}<red>Bạn đang ở trong một phiên Bí Cảnh khác.</red>"
    not-ready: "{prefix}<red>Bí Cảnh chưa sẵn sàng. Admin cần kiểm tra spawn, điểm mob và MythicMob.</red>"
    disabled: "{prefix}<red>Bí Cảnh đang bị tắt.</red>"
    no-gate: "{prefix}<yellow>AL hiện tại không có Bí Cảnh cần vượt qua.</yellow>"
    command-blocked: "{prefix}<red>Không thể dùng lệnh trong khi đang tham gia Bí Cảnh.</red>"
    teleport-blocked: "{prefix}<red>Không thể dịch chuyển khỏi Bí Cảnh đang chạy.</red>"
    progression-changed: "{prefix}<red>Trạng thái AL/AE đã thay đổi trong phiên; không thể hoàn tất đột phá.</red>"
    completed-broadcast: "{prefix}<gold>✦ <white>{player}</white> đã vượt qua <yellow>{bicanh}</yellow> và đột phá <aqua>AL {level} → {next_level}</aqua>!</gold>"
    failed-broadcast: "{prefix}<red>✦ <white>{player}</white> đã thất bại tại <yellow>{bicanh}</yellow>.</red>"
